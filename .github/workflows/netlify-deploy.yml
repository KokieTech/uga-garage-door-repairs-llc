name: Deploy to Netlify

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: npm test

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html styles.css script.js dist/
          cp -R assets dist/assets

      - name: Deploy production site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in repository Actions secrets. See README.md."
            exit 1
          fi
          npx --yes netlify-cli@23 deploy --prod --no-build --dir=dist --message "GitHub Actions: $GITHUB_SHA"
